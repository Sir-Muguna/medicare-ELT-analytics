version: 2

models:
  - name: fact_payment_analysis
    description: "Unified view of Medicare payments across inpatient and outpatient settings for provider performance ranking"
    config:
      materialized: table
    columns:
      - name: payment_id
        description: "UUID primary key generated from provider_id, service_year, and care_setting"
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: provider_id
        description: "Unique identifier for healthcare provider"
        data_type: string
        tests:
          - not_null
          
      - name: provider_name
        description: "Name of healthcare facility in uppercase"
        data_type: string
        
      - name: provider_state
        description: "State where provider is located in uppercase"
        data_type: string
        
      - name: service_year
        description: "Year of service (2011, 2012, or 2013)"
        data_type: integer
        
      - name: care_setting
        description: "Type of care setting - INPATIENT or OUTPATIENT"
        data_type: string
        
      - name: service_volume
        description: "Number of services provided (discharges for inpatient, visits for outpatient)"
        data_type: integer
        
      - name: medicare_payment_amount
        description: "Average Medicare payments received per service"
        data_type: numeric
        
      - name: total_payment_amount
        description: "Average total payments received per service (includes copayments)"
        data_type: numeric
        
      - name: submitted_charges_amount
        description: "Average charges submitted per service"
        data_type: numeric
        
      - name: medicare_payment_ratio
        description: "Ratio of Medicare payments to submitted charges"
        data_type: numeric
        
      - name: volume_category
        description: "Categorized service volume (high_volume, medium_volume, low_volume)"
        data_type: string

  - name: dim_providers
    description: "Master provider dimension table with geographic, service capability, and quality metrics for healthcare provider analysis"
    config:
      materialized: table
      cluster_by: ['provider_state', 'provider_type']
    columns:
      - name: provider_id
        description: "Unique provider identifier - primary key for provider dimension"
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: provider_name
        description: "Provider name in proper case formatting"
        data_type: string
        tests:
          - not_null
          
      - name: provider_state
        description: "Provider state location in proper case"
        data_type: string
        tests:
          - not_null
          
      - name: county_name
        description: "County where provider is located"
        data_type: string
        
      - name: city
        description: "City where provider is located"  
        data_type: string
        
      - name: zip_code
        description: "Postal zip code"
        data_type: string
        
      - name: provider_type
        description: "Type of hospital facility (Acute Care, Critical Access, etc.)"
        data_type: string
        
      - name: ownership_type
        description: "Ownership type of hospital (Government, Proprietary, etc.)"
        data_type: string
        
      - name: offers_emergency_services
        description: "Boolean flag indicating if provider offers emergency services"
        data_type: boolean
        
      - name: ehr_interoperable
        description: "Boolean flag indicating if provider meets EHR interoperability criteria"
        data_type: boolean
        
      - name: quality_rating
        description: "Hospital overall quality rating on 1-5 scale"
        data_type: integer
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
              
      - name: safety_measures_count
        description: "Total number of safety measures tracked"
        data_type: integer
        
      - name: readmission_measures_count  
        description: "Total number of readmission measures tracked"
        data_type: integer
        
      - name: service_level
        description: "Business classification of provider service capability level"
        data_type: string

  - name: dim_diagnosis_codes
    description: "Unified diagnosis code reference table with ICD-10 and ICD-11 codes for clinical pattern analysis"
    config:
      materialized: table
    columns:
      - name: diagnosis_code
        description: "Standardized diagnosis code in uppercase"
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: code_system
        description: "Code system identifier - ICD-10 or ICD-11"
        data_type: string
        tests:
          - not_null
          
      - name: diagnosis_description
        description: "Unified disease description in uppercase"
        data_type: string
        tests:
          - not_null
          
      - name: chapter
        description: "Chapter identifier in original format (roman numerals for ICD-10, numbers for ICD-11)"
        data_type: string
        
      - name: chapter_description
        description: "Chapter description in uppercase"
        data_type: string
        
      - name: code_category
        description: "Code category range or grouping in uppercase"
        data_type: string
        
      - name: hierarchy_level
        description: "Hierarchy depth level for clinical grouping"
        data_type: integer
        
      - name: is_leaf_code
        description: "Boolean indicating if this is a leaf node in the hierarchy"
        data_type: boolean
        
      - name: classification_type
        description: "Type of classification category in uppercase"
        data_type: string
        
      - name: is_residual_category
        description: "Boolean indicating if this is a residual category"
        data_type: boolean

  - name: fact_outpatient_services
    description: "Outpatient service charge time series analysis at provider-APC level for trend analysis and service pattern identification"
    config:
      materialized: table
    columns:
      - name: outpatient_id
        description: "UUID primary key generated from provider_id, service_year, and apc_code"
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: service_year
        description: "Year of service data (2011, 2012, or 2013)"
        data_type: integer
        tests:
          - not_null
          
      - name: apc_code
        description: "Ambulatory Payment Classification code in uppercase"
        data_type: string
        tests:
          - not_null
          
      - name: apc_description
        description: "APC service description in uppercase"
        data_type: string
        tests:
          - not_null
          
      - name: provider_id
        description: "Unique provider identifier"
        data_type: string
        tests:
          - not_null
          - relationships:
              to: ref('dim_providers')
              field: provider_id
          
      - name: provider_name
        description: "Provider name in uppercase"
        data_type: string
        
      - name: provider_state
        description: "Provider state location in uppercase"
        data_type: string
        
      - name: provider_type
        description: "Type of hospital facility in uppercase"
        data_type: string
        
      - name: offers_emergency_services
        description: "Boolean flag indicating if provider offers emergency services"
        data_type: boolean
        
      - name: quality_rating
        description: "Hospital overall quality rating on 1-5 scale"
        data_type: integer
        
      - name: service_volume
        description: "Number of outpatient services provided"
        data_type: integer
        
      - name: average_payment_amount
        description: "Average payments received per service"
        data_type: numeric
        
      - name: average_submitted_charge
        description: "Average charges submitted per service"
        data_type: numeric
        
      - name: payment_to_charge_ratio
        description: "Ratio of average payments to submitted charges"
        data_type: numeric
        
      - name: service_volume_category
        description: "Business classification of service volume"
        data_type: string

  - name: fact_inpatient_services
    description: "Inpatient discharge and payment analysis with diagnosis patterns for clinical trend analysis and state-level reporting"
    config:
      materialized: table
    columns:
      - name: inpatient_id
        description: "UUID primary key generated from provider_id, service_year, and icd_category"
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: service_year
        description: "Year of service data (2011, 2012, or 2013)"
        data_type: integer
        tests:
          - not_null
          
      - name: icd_category
        description: "ICD diagnosis category in uppercase"
        data_type: string
        tests:
          - not_null
          
      - name: provider_id
        description: "Unique provider identifier"
        data_type: string
        tests:
          - not_null
          - relationships:
              to: ref('dim_providers')
              field: provider_id
          
      - name: provider_name
        description: "Provider name in uppercase"
        data_type: string
        
      - name: provider_state
        description: "Provider state location in uppercase"
        data_type: string
        
      - name: provider_type
        description: "Type of hospital facility in uppercase"
        data_type: string
        
      - name: offers_emergency_services
        description: "Boolean flag indicating if provider offers emergency services"
        data_type: boolean
        
      - name: quality_rating
        description: "Hospital overall quality rating on 1-5 scale"
        data_type: integer
        
      - name: diagnosis_description
        description: "ICD diagnosis description in uppercase"
        data_type: string
        
      - name: chapter
        description: "ICD chapter in original format"
        data_type: string
        
      - name: chapter_description
        description: "ICD chapter description in uppercase"
        data_type: string
        
      - name: total_discharges
        description: "Number of inpatient discharges"
        data_type: integer
        
      - name: average_covered_charges
        description: "Average charges covered per discharge"
        data_type: numeric
        
      - name: average_total_payments
        description: "Average total payments per discharge"
        data_type: numeric
        
      - name: average_medicare_payments
        description: "Average Medicare payments per discharge"
        data_type: numeric
        
      - name: medicare_payment_ratio
        description: "Ratio of Medicare payments to covered charges"
        data_type: numeric
        
      - name: discharge_volume_category
        description: "Business classification of discharge volume"
        data_type: string

  - name: fact_medicare_claims
    description: "National-level Medicare Part D prescription drug claims analysis for drug utilization patterns, cost trends, and substance category analysis"
    config:
      materialized: table
      cluster_by: ['service_year', 'drug_category']
    columns:
      - name: claim_id
        description: "UUID primary key generated from drug_id and service_year"
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: service_year
        description: "Year of service data (2011, 2012, or 2013)"
        data_type: integer
        tests:
          - not_null
          
      - name: drug_id
        description: "Unique drug identifier - MD5 hash of brand and generic name"
        data_type: string
        tests:
          - not_null
          
      - name: brand_name
        description: "Brand name of the prescribed drug in uppercase"
        data_type: string
        tests:
          - not_null
          
      - name: generic_name
        description: "Generic name of the prescribed drug in uppercase"
        data_type: string
        tests:
          - not_null
          
      - name: total_claims
        description: "Total number of claims submitted across all beneficiaries"
        data_type: integer
        
      - name: total_beneficiaries
        description: "Total number of unique Medicare beneficiaries receiving the drug"
        data_type: integer
        
      - name: total_prescribers
        description: "Total number of unique prescribing physicians"
        data_type: integer
        
      - name: total_30day_fills
        description: "Total number of 30-day medication fills across all claims"
        data_type: numeric
        
      - name: total_drug_cost
        description: "Total cost of all drug claims in dollars"
        data_type: numeric
        
      - name: low_income_cost_share
        description: "Low-income subsidy cost share amount in dollars"
        data_type: numeric
        
      - name: non_low_income_cost_share
        description: "Non-low-income subsidy cost share amount in dollars"
        data_type: numeric
        
      - name: is_antibiotic_drug
        description: "Boolean flag indicating if drug is classified as an antibiotic"
        data_type: boolean
        
      - name: is_opioid_drug
        description: "Boolean flag indicating if drug is classified as an opioid"
        data_type: boolean
        
      - name: is_long_acting_opioid
        description: "Boolean flag indicating if drug is classified as a long-acting opioid"
        data_type: boolean
        
      - name: is_antipsychotic_drug
        description: "Boolean flag indicating if drug is classified as an antipsychotic"
        data_type: boolean
        
      - name: ge65_total_claims
        description: "Total claims for beneficiaries aged 65 and older"
        data_type: integer
        
      - name: ge65_total_beneficiaries
        description: "Total beneficiaries aged 65 and older receiving the drug"
        data_type: integer
        
      - name: ge65_total_30day_fills
        description: "30-day medication fills for 65+ beneficiaries"
        data_type: numeric
        
      - name: ge65_total_drug_cost
        description: "Total drug cost for 65+ beneficiaries in dollars"
        data_type: numeric
        
      - name: cost_per_claim
        description: "Average cost per claim calculated as total drug cost divided by total claims"
        data_type: numeric
        
      - name: claims_per_prescriber
        description: "Average claims per prescribing physician calculated as total claims divided by total prescribers"
        data_type: numeric
        
      - name: ge65_claim_ratio
        description: "Ratio of 65+ claims to total claims, representing proportion of elderly beneficiaries"
        data_type: numeric
        
      - name: drug_category
        description: "Business classification of drug type based on therapeutic category flags"
        data_type: string

        